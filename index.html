<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Duka Find — Find your duka</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;0,9..144,700;0,9..144,800;1,9..144,500;1,9..144,600&family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --cream:#FCF7EC; --cream-deep:#F4EBD9; --paper:#FFFFFF;
    --ink:#20291E; --ink-soft:#5C6B5F; --ink-faint:#8B9A8C;
    --green:#2E6E4E; --green-dark:#1B4A32; --green-soft:#E6F1EA;
    --mango:#EDA93A; --mango-soft:#FCEFD4;
    --paprika:#C6512E; --paprika-soft:#F8E3DA;
    --line:rgba(32,41,30,0.10);
    --shadow-sm:0 6px 18px rgba(32,41,30,0.06);
    --shadow-md:0 18px 40px rgba(32,41,30,0.12);
    --r-lg:24px; --r-md:16px; --r-sm:11px; --r-pill:999px;
  }
  *{box-sizing:border-box;}
  html{height:100%;}
  body{margin:0;min-height:100dvh;background:var(--cream);color:var(--ink);font-family:'Inter',sans-serif;line-height:1.5;-webkit-font-smoothing:antialiased;}
  h1,h2,h3{font-family:'Fraunces',serif;margin:0 0 4px;letter-spacing:-0.01em;}
  button,input,textarea,select{font-family:inherit;}
  img{max-width:100%;}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;}}
  :focus-visible{outline:2.5px solid var(--green);outline-offset:2px;}
  svg{width:20px;height:20px;display:block;}

  .app{max-width:1180px;margin:0 auto;position:relative;padding-bottom:78px;}
  @media(min-width:720px){.app{padding-bottom:0;}}

  header.topbar{position:relative;overflow:hidden;background:linear-gradient(160deg,var(--green-dark),var(--green) 130%);color:#fff;border-radius:0 0 28px 28px;}
  .blob{position:absolute;border-radius:50%;filter:blur(2px);opacity:0.16;background:var(--mango);}
  .blob1{width:220px;height:220px;top:-110px;right:-60px;}
  .blob2{width:160px;height:160px;bottom:-90px;left:10%;opacity:0.12;}
  .topbar-inner{position:relative;max-width:1180px;margin:0 auto;padding:20px 20px 26px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;}
  .logo{display:flex;align-items:center;gap:10px;}
  .logo-mark{width:38px;height:38px;border-radius:11px;background:var(--mango);display:flex;align-items:center;justify-content:center;color:var(--green-dark);flex:none;}
  .logo-text{font-family:'Fraunces',serif;font-size:1.35rem;font-weight:700;}
  .logo-sub{font-size:0.68rem;letter-spacing:0.13em;text-transform:uppercase;opacity:0.8;font-family:'IBM Plex Mono',monospace;}

  .top-right{display:flex;align-items:center;gap:10px;}
  .top-nav{display:none;gap:6px;background:rgba(255,255,255,0.12);padding:5px;border-radius:var(--r-pill);}
  @media(min-width:720px){.top-nav{display:flex;}}
  .nav-btn{display:flex;align-items:center;gap:7px;background:none;border:none;color:#fff;opacity:0.82;font-weight:600;font-size:0.88rem;padding:9px 16px;border-radius:var(--r-pill);cursor:pointer;transition:opacity .15s,background .15s;position:relative;}
  .nav-btn:hover{opacity:1;}
  .nav-btn.active{background:#fff;color:var(--green-dark);opacity:1;}
  .nav-badge{background:var(--paprika);color:#fff;font-family:'IBM Plex Mono',monospace;font-size:0.68rem;min-width:17px;height:17px;border-radius:9px;display:inline-flex;align-items:center;justify-content:center;padding:0 4px;}

  .auth-pill{display:flex;align-items:center;gap:8px;background:#fff;color:var(--green-dark);border:none;font-weight:700;font-size:0.84rem;padding:9px 16px;border-radius:var(--r-pill);cursor:pointer;}
  .user-chip{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,0.14);color:#fff;padding:6px 8px 6px 6px;border-radius:var(--r-pill);}
  .user-chip .avatar{width:28px;height:28px;font-size:0.78rem;}
  .user-chip button{background:none;border:none;color:#fff;opacity:0.8;font-size:0.78rem;font-weight:700;cursor:pointer;}
  .user-chip button:hover{opacity:1;}

  .views{position:relative;padding:0 20px;}
  .view.root{display:none;max-width:1180px;margin:0 auto;padding-top:26px;}
  .view.root.active{display:block;animation:riseIn .35s ease;}
  @keyframes riseIn{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}

  .hero{max-width:56ch;margin-bottom:22px;}
  .eyebrow{font-family:'IBM Plex Mono',monospace;font-size:0.78rem;color:var(--green);font-weight:600;margin:0 0 6px;}
  .hero h1{font-size:1.7rem;}
  .hero .sub{color:var(--ink-soft);margin:6px 0 0;}

  .search-wrap{position:relative;max-width:520px;margin-bottom:24px;}
  .search-wrap svg{position:absolute;left:16px;top:50%;transform:translateY(-50%);color:var(--ink-faint);width:19px;height:19px;pointer-events:none;}
  .search-wrap input{width:100%;padding:13px 16px 13px 46px;border:1.6px solid var(--line);border-radius:var(--r-pill);background:var(--paper);font-size:0.92rem;color:var(--ink);box-shadow:var(--shadow-sm);transition:border-color .15s,box-shadow .15s;}
  .search-wrap input:focus{outline:none;border-color:var(--green);box-shadow:0 0 0 4px var(--green-soft);}
  .search-wrap .clear-btn{position:absolute;right:8px;top:50%;transform:translateY(-50%);width:26px;height:26px;border-radius:50%;border:none;background:var(--cream-deep);color:var(--ink-soft);cursor:pointer;display:none;align-items:center;justify-content:center;}
  .search-wrap .clear-btn svg{position:static;transform:none;width:14px;height:14px;color:inherit;}
  .search-wrap.has-value .clear-btn{display:flex;}
  .match-note{display:flex;align-items:center;gap:5px;font-size:0.76rem;color:var(--green-dark);background:var(--green-soft);padding:4px 10px;border-radius:var(--r-pill);margin-top:8px;width:fit-content;}
  .match-note svg{width:13px;height:13px;}
  .search-count{color:var(--ink-faint);font-size:0.82rem;margin:-14px 0 18px;}
  .category-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:14px;margin-bottom:22px;}
  .category-card{position:relative;aspect-ratio:3/4;border-radius:var(--r-lg);overflow:hidden;cursor:pointer;border:none;padding:0;text-align:left;background:var(--cat-grad);transition:transform .18s,box-shadow .18s;box-shadow:var(--shadow-sm);}
  .category-card:hover{transform:translateY(-3px);box-shadow:var(--shadow-md);}
  .category-card.active{outline:3px solid var(--green); outline-offset:2px;}
  .category-card .cat-photo{position:absolute;inset:0;background-size:cover;background-position:center;}
  .category-card .cat-overlay{position:absolute;inset:0;background:linear-gradient(180deg, rgba(0,0,0,0.05) 0%, rgba(0,0,0,0.55) 100%);}
  .category-card .cat-icon{position:absolute;top:14px;left:14px;width:34px;height:34px;border-radius:10px;background:rgba(255,255,255,0.22);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;color:#fff;}
  .category-card .cat-icon svg{width:18px;height:18px;}
  .category-card .cat-body{position:absolute;left:14px;right:14px;bottom:12px;color:#fff;}
  .category-card .cat-body h3{color:#fff;font-size:1.02rem;margin:0 0 2px;}
  .category-card .cat-stat{font-size:0.72rem;opacity:0.85;display:block;margin-bottom:8px;}
  .category-card .cat-explore{display:inline-flex;align-items:center;gap:4px;font-size:0.76rem;font-weight:700;color:#fff;}
  .category-card .cat-explore svg{width:13px;height:13px;transition:transform .15s;}
  .category-card:hover .cat-explore svg{transform:translateX(3px);}
  .cat-clothing{--cat-grad:linear-gradient(160deg,#2c5364,#203a43,#0f2027);}
  .cat-cosmetics{--cat-grad:linear-gradient(160deg,#e195ab,#c06c94,#6b3a5e);}
  .cat-electronics{--cat-grad:linear-gradient(160deg,#3a7bd5,#2c5f8a,#142b42);}
  .cat-hardware{--cat-grad:linear-gradient(160deg,#7d6354,#5a4536,#2e241c);}
  .cat-plastics{--cat-grad:linear-gradient(160deg,#38ada9,#2c8c89,#155e59);}
  .cat-furniture{--cat-grad:linear-gradient(160deg,#c99a5b,#9c6e3e,#5c3f24);}
  .cat-retail{--cat-grad:linear-gradient(160deg,#eda93a,#c6812a,#8a541a);}
  .cat-wholesale{--cat-grad:linear-gradient(160deg,#556270,#3a4750,#1f262b);}
  .cat-other{--cat-grad:linear-gradient(160deg,#2e6e4e,#1b4a32,#0e2c1e);}
  .section-head{margin-bottom:20px;}
  .section-head h1{font-size:1.7rem;}
  .section-head .sub{color:var(--ink-soft);margin:6px 0 0;}

  .card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:18px;padding-bottom:20px;}
  .shop-card{background:var(--paper);border-radius:var(--r-lg);overflow:hidden;box-shadow:var(--shadow-sm);border:1px solid var(--line);cursor:pointer;transition:transform .18s,box-shadow .18s;}
  .shop-card:hover{transform:translateY(-3px);box-shadow:var(--shadow-md);}
  .shop-cover{position:relative;height:170px;background:linear-gradient(135deg,var(--green),var(--green-dark)) center/cover no-repeat;}
  .shop-cover::after{content:'';position:absolute;inset:0;background:linear-gradient(0deg,rgba(20,28,20,0.72) 0%,rgba(20,28,20,0) 55%);}
  .shop-cover-empty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,0.7);}
  .shop-cover-info{position:absolute;left:16px;right:16px;bottom:13px;color:#fff;z-index:1;}
  .shop-cover-info h3{color:#fff;font-size:1.18rem;margin-bottom:2px;}
  .shop-loc{display:inline-flex;align-items:center;gap:5px;font-size:0.8rem;opacity:0.92;}
  .shop-loc svg{width:14px;height:14px;}
  .shop-card-foot{padding:13px 16px;display:flex;align-items:center;justify-content:space-between;}
  .view-shop{color:var(--green);font-weight:700;font-size:0.85rem;display:flex;align-items:center;gap:4px;}
  .view-shop svg{width:16px;height:16px;}

  .empty-state{background:var(--paper);border:1.5px dashed var(--line);border-radius:var(--r-lg);padding:44px 24px;text-align:center;color:var(--ink-soft);}
  .empty-state .es-icon{width:52px;height:52px;border-radius:50%;background:var(--green-soft);color:var(--green);display:flex;align-items:center;justify-content:center;margin:0 auto 14px;}
  .empty-state h3{color:var(--ink);margin-bottom:6px;}
  .google-btn{margin-top:14px;display:inline-flex;align-items:center;gap:10px;background:#fff;border:1.5px solid var(--line);color:var(--ink);font-weight:700;font-size:0.88rem;padding:11px 20px;border-radius:var(--r-pill);cursor:pointer;box-shadow:var(--shadow-sm);}
  .google-btn:hover{border-color:var(--green);}

  .conv-list{display:flex;flex-direction:column;gap:10px;padding-bottom:20px;}
  .conv-row{display:flex;align-items:center;gap:13px;background:var(--paper);border:1px solid var(--line);border-radius:var(--r-md);padding:13px 15px;cursor:pointer;transition:transform .15s,box-shadow .15s;}
  .conv-row:hover{transform:translateY(-1px);box-shadow:var(--shadow-sm);}
  .avatar{width:46px;height:46px;border-radius:50%;background:var(--green);color:#fff;display:flex;align-items:center;justify-content:center;font-family:'Fraunces',serif;font-weight:700;font-size:1.1rem;flex:none;}
  .conv-main{flex:1;min-width:0;}
  .conv-top{display:flex;justify-content:space-between;gap:8px;}
  .conv-top h4{margin:0;font-family:'Fraunces',serif;font-size:1.02rem;}
  .conv-time{font-family:'IBM Plex Mono',monospace;font-size:0.68rem;color:var(--ink-faint);white-space:nowrap;}
  .conv-preview{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:2px;}
  .conv-preview p{margin:0;font-size:0.85rem;color:var(--ink-soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .dot{width:9px;height:9px;border-radius:50%;background:var(--paprika);flex:none;}

  .view.pushed{position:fixed;inset:0;background:var(--cream);z-index:60;transform:translateX(100%);transition:transform .32s cubic-bezier(.22,.61,.36,1);display:flex;flex-direction:column;}
  .view.pushed.active{transform:translateX(0);}
  .page-head{flex:none;display:flex;align-items:center;gap:14px;padding:16px 18px;background:var(--paper);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:2;}
  .page-head h2{font-size:1.05rem;flex:1;text-align:center;}
  .icon-btn.round{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--paper);color:var(--ink);display:flex;align-items:center;justify-content:center;cursor:pointer;flex:none;}
  .icon-btn.round:hover{background:var(--green-soft);color:var(--green-dark);}
  .page-body{flex:1;overflow-y:auto;padding-bottom:100px;}

  .detail-cover{height:220px;background:linear-gradient(135deg,var(--green),var(--green-dark)) center/cover no-repeat;}
  .detail-content{max-width:760px;margin:0 auto;padding:22px 20px 40px;}
  .detail-content h1{font-size:1.5rem;}
  .gallery{display:flex;gap:9px;margin:14px 0 4px;overflow-x:auto;padding-bottom:4px;}
  .gallery img{width:74px;height:74px;object-fit:cover;border-radius:12px;border:1px solid var(--line);flex:none;}
  .policy{background:var(--green-soft);border-radius:var(--r-md);padding:14px 16px;font-size:0.88rem;color:var(--green-dark);margin:18px 0 26px;display:flex;gap:10px;align-items:flex-start;}
  .policy svg{flex:none;margin-top:1px;}
  .policy b{display:block;font-size:0.72rem;text-transform:uppercase;letter-spacing:0.07em;font-family:'IBM Plex Mono',monospace;margin-bottom:3px;opacity:0.85;}
  .verified-badge{display:inline-flex;align-items:center;gap:5px;background:var(--green-soft);color:var(--green-dark);font-size:0.74rem;font-weight:700;padding:4px 10px;border-radius:var(--r-pill);margin-top:8px;}
  .verified-badge svg{width:14px;height:14px;}

  .products-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px;align-items:stretch;}
  .product-card{background:var(--paper);border:1px solid var(--line);border-radius:var(--r-md);overflow:hidden;transition:transform .15s,box-shadow .15s;display:flex;flex-direction:column;height:100%;}
  .product-card:hover{transform:translateY(-2px);box-shadow:var(--shadow-sm);}
  .product-img-wrap{position:relative;flex:none;background:var(--cream-deep);}
  .product-img-wrap img{width:100%;height:120px;object-fit:cover;display:block;cursor:zoom-in;}
  .product-img-wrap:not(.has-img){height:120px;display:flex;align-items:center;justify-content:center;color:var(--ink-faint);}
  .product-card-body{padding:12px 13px 13px;display:flex;flex-direction:column;flex:1;gap:5px;}
  .product-card-body h4{font-family:'Fraunces',serif;font-size:0.97rem;margin:0;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .meta-row{display:flex;align-items:center;flex-wrap:wrap;gap:8px;min-height:20px;}
  .product-card-body p.product-desc{font-size:0.8rem;color:var(--ink-soft);margin:0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.6em;}
  .product-talk-btn{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;margin-top:8px;background:var(--green-soft);color:var(--green-dark);border:none;padding:8px 10px;border-radius:var(--r-pill);font-size:0.78rem;font-weight:700;cursor:pointer;}
  .product-talk-btn svg{width:14px;height:14px;}
  .product-talk-btn:hover{background:var(--green);color:#fff;}
  .tag{position:relative;display:inline-flex;align-items:center;background:var(--mango);color:var(--green-dark);padding:3px 12px 3px 18px;font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:0.76rem;clip-path:polygon(9px 0,100% 0,100% 100%,9px 100%,0 50%);}
  .tag::before{content:'';position:absolute;left:5px;top:50%;transform:translateY(-50%);width:4px;height:4px;border-radius:50%;background:var(--cream);}
  .neg-note{display:inline-flex;align-items:center;gap:4px;font-size:0.72rem;color:var(--ink-faint);font-weight:600;}
  .neg-note::before{content:'';width:5px;height:5px;border-radius:50%;background:var(--ink-faint);}

  .lightbox{position:fixed;inset:0;background:rgba(20,28,20,0.88);z-index:90;display:none;align-items:center;justify-content:center;padding:24px;}
  .lightbox.open{display:flex;}
  .lightbox img{max-width:100%;max-height:88vh;border-radius:12px;box-shadow:0 20px 60px rgba(0,0,0,0.4);}
  .lightbox-close{position:absolute;top:20px;right:20px;width:42px;height:42px;border-radius:50%;background:rgba(255,255,255,0.15);color:#fff;border:none;display:flex;align-items:center;justify-content:center;cursor:pointer;}
  .lightbox-close:hover{background:rgba(255,255,255,0.28);}

  .btn{font-weight:700;font-size:0.94rem;border:none;border-radius:var(--r-pill);padding:14px 22px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:transform .12s,background .15s;}
  .btn:active{transform:scale(0.97);}
  .btn-block{width:100%;max-width:760px;margin:0 auto;display:flex;}
  .btn-primary{background:var(--green);color:#fff;box-shadow:0 10px 24px rgba(46,110,78,0.30);}
  .btn-primary:hover{background:var(--green-dark);}

  .chat-head-info{display:flex;align-items:center;gap:10px;flex:1;}
  .chat-head-info .avatar{width:36px;height:36px;font-size:0.95rem;}
  .chat-head-info h2{font-size:1rem;text-align:left;margin:0;}
  .tiny{font-size:0.72rem;color:var(--ink-soft);}
  .chat-scroll{flex:1;overflow-y:auto;padding:18px 16px;display:flex;flex-direction:column;gap:10px;background:radial-gradient(circle at 10% 0%, rgba(46,110,78,0.05), transparent 40%),var(--cream-deep);}
  .msg{max-width:76%;padding:10px 14px;border-radius:16px;font-size:0.9rem;box-shadow:var(--shadow-sm);}
  .msg.customer{background:var(--green);color:#fff;align-self:flex-end;border-bottom-right-radius:4px;}
  .msg.owner{background:var(--paper);color:var(--ink);align-self:flex-start;border-bottom-left-radius:4px;border:1px solid var(--line);}
  .msg time{display:block;font-family:'IBM Plex Mono',monospace;font-size:0.63rem;opacity:0.65;margin-top:5px;}
  .empty-chat{margin:auto;text-align:center;color:var(--ink-soft);font-size:0.88rem;max-width:26ch;}

  .composer{flex:none;display:flex;align-items:flex-end;gap:10px;padding:12px 14px;padding-bottom:max(12px, env(safe-area-inset-bottom));background:var(--paper);border-top:1px solid var(--line);}
  .attach-btn{width:44px;height:44px;border-radius:50%;background:var(--cream);color:var(--ink-soft);border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center;cursor:pointer;flex:none;}
  .attach-btn:hover{background:var(--green-soft);color:var(--green-dark);border-color:var(--green-soft);}
  .image-preview-bar{flex:none;display:flex;align-items:center;gap:10px;padding:10px 16px;background:var(--paper);border-top:1px solid var(--line);font-size:0.82rem;color:var(--ink-soft);}
  .image-preview-bar img{width:40px;height:40px;object-fit:cover;border-radius:8px;border:1px solid var(--line);}
  .image-preview-bar button{margin-left:auto;background:none;border:none;color:var(--ink-faint);cursor:pointer;width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;}
  .image-preview-bar button:hover{background:var(--cream-deep);}
  .msg img.chat-img{max-width:100%;border-radius:10px;display:block;cursor:zoom-in;}
  .msg img.chat-img + .msg-caption{margin-top:6px;}
  .composer textarea{flex:1;resize:none;max-height:110px;border:1.5px solid var(--line);border-radius:20px;padding:11px 16px;font-size:0.9rem;background:var(--cream);color:var(--ink);}
  .composer textarea:focus{outline:none;border-color:var(--green);}
  .send-btn{width:44px;height:44px;border-radius:50%;background:var(--green);color:#fff;border:none;display:flex;align-items:center;justify-content:center;cursor:pointer;flex:none;transition:background .15s,transform .12s;}
  .send-btn:hover{background:var(--green-dark);}
  .send-btn:active{transform:scale(0.93);}
  .send-btn:disabled{opacity:0.5;cursor:not-allowed;}

  .bottom-nav{position:fixed;left:0;right:0;bottom:0;background:var(--paper);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:8px 10px max(8px, env(safe-area-inset-bottom));z-index:55;box-shadow:0 -6px 20px rgba(32,41,30,0.06);}
  @media(min-width:720px){.bottom-nav{display:none;}}
  .bn-btn{position:relative;background:none;border:none;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--ink-faint);font-size:0.68rem;font-weight:600;padding:6px 22px;border-radius:14px;cursor:pointer;}
  .bn-btn.active{color:var(--green-dark);background:var(--green-soft);}

    await sb.auth.signInWithOAuth({ provider: 'google', options: { redirectTo: window.location.href } });

  async function signOut(){
    await sb.auth.signOut();
    currentUser = null;
    renderAuthArea();
    setRoot('home');
  }
  function renderAuthArea(){
    const el = $('#authArea');
    if(currentUser){
      const name = currentUser.user_metadata?.full_name || currentUser.email || 'You';

          <div class="avatar">${name.charAt(0).toUpperCase()}</div>
          <button id="logoutBtn">Log out</button>
        </div>`;
      $('#logoutBtn').addEventListener('click', signOut);
    } else {
      el.innerHTML = `<button class="auth-pill" id="loginBtn">${ICON_GOOGLE} Sign in</button>`;
      $('#loginBtn').addEventListener('click', signInWithGoogle);

  // ensure a profiles row exists for a signed-in customer
  async function ensureCustomerProfile(user){
    await sb.from('profiles').upsert({
      id: user.id, role: 'customer',
      full_name: user.user_metadata?.full_name || null,
      email: user.email
    });
  }

  /* ---------------- nav ---------------- */

    closePushed();
    if(root === 'messages') renderConvList();
    if(root === 'map') initMapTab();
  }
  document.querySelectorAll('[data-root]').forEach(btn => btn.addEventListener('click', ()=> setRoot(btn.dataset.root)));

  function openPushed(id){ $(id).classList.add('active'); }
  function closePushedOne(id){ $(id).classList.remove('active'); }
  function closePushed(){ closePushedOne('#view-detail'); closePushedOne('#view-chat'); }
  $('#detailBack').addEventListener('click', ()=> closePushedOne('#view-detail'));

  /* ---------------- home: shop list + search + category ---------------- */

  function renderCategoryRow(){
    const wrap = $('#categoryRow');
    wrap.innerHTML = CATEGORIES.map(c=>{
      const count = allShops.filter(s => s.category === c.value).length;
      const isActive = activeCategory === c.value;
      return `
        <button class="category-card ${c.cls} ${isActive ? 'active' : ''}" data-cat="${c.value}">
          ${c.photo ? `<div class="cat-photo" style="background-image:url('${c.photo}')"></div><div class="cat-overlay"></div>` : ''}
          <div class="cat-icon">${c.icon}</div>
          <div class="cat-body">
            <h3>${c.label}</h3>
            <span class="cat-stat">${count} shop${count===1?'':'s'}</span>
            <span class="cat-explore">${isActive ? 'Showing' : 'Explore'} ${ICON_CHEV}</span>
          </div>
        </button>`;
    }).join('');
    wrap.querySelectorAll('.category-card').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const cat = btn.dataset.cat;
        activeCategory = activeCategory === cat ? '' : cat; // tap again to clear
        renderCategoryRow();
        renderCards($('#shopSearch').value);
        $('#cardArea').scrollIntoView({ behavior:'smooth', block:'start' });
      });
    });
  }

  async function fetchShops(){
    // Only verified shops are shown to customers. Column list is explicit so
    // tin_number never reaches the browser.
    const { data, error } = await sb
      .from('shops')
      .select('id, business_name, username, category, location, delivery_policy, verified, latitude, longitude, shop_images(url), products(*)')
      .eq('verified', true)
      .order('created_at', { ascending: false });
    if(error){ console.error(error); return []; }
    return data;
  }

  // Matches shop name, username, location, AND every product name the shop owner has
  // typed in on their dashboard — so searching "tomatoes" surfaces any shop selling them.
  // Also respects the active category chip, if one is selected.
  function filterShops(shops, query){
    const q = query.trim().toLowerCase();
    const byCategory = activeCategory ? shops.filter(s => s.category === activeCategory) : shops;
    if(!q) return byCategory.map(s => ({ shop: s, matchedProduct: null }));
    return byCategory
      .map(shop => {
        const fieldsMatch =
          shop.business_name?.toLowerCase().includes(q) ||
          shop.username?.toLowerCase().includes(q) ||
          shop.location?.toLowerCase().includes(q);
        const matchedProduct = (shop.products || []).find(p => p.name?.toLowerCase().includes(q));
        if(fieldsMatch || matchedProduct) return { shop, matchedProduct: fieldsMatch ? null : matchedProduct };
        return null;
      })
      .filter(Boolean);
  }

  function renderCards(query = ''){
    const wrap = $('#cardArea');
    const results = filterShops(allShops, query);
    const countEl = $('#searchCount');

    if(query.trim() || activeCategory){
      countEl.hidden = false;
      const catLabel = CATEGORIES.find(c => c.value === activeCategory)?.label;
      const parts = [];
      if(catLabel) parts.push(catLabel);
      if(query.trim()) parts.push(`"${query.trim()}"`);
      countEl.textContent = `${results.length} shop${results.length===1?'':'s'} match ${parts.join(' + ')}`;
    } else {
      countEl.hidden = true;
    }

    if(allShops.length === 0){
      wrap.innerHTML = '';
      return;
    }
    if(results.length === 0){
      const catLabel = CATEGORIES.find(c => c.value === activeCategory)?.label;
      wrap.innerHTML = catLabel
        ? `<div class="empty-state" style="grid-column:1/-1;">
            <div class="es-icon">${ICON_STORE_LG}</div>
            <h3>No ${catLabel.toLowerCase()} shops yet</h3>
            <p>None have been verified in this category yet — check back soon, or browse another category.</p>
            <button class="google-btn" id="clearCategoryBtn" style="margin-top:14px;">Show all shops</button>
          </div>`
        : `<div class="empty-state" style="grid-column:1/-1;">
            <div class="es-icon">${ICON_STORE_LG}</div>
            <h3>No matches</h3>
            <p>Try a different shop name, username, location, or product.</p>
          </div>`;
      $('#clearCategoryBtn')?.addEventListener('click', ()=>{
        activeCategory = '';
        renderCategoryRow();
        renderCards($('#shopSearch').value);
      });
      return;
    }
    wrap.innerHTML = results.map(({ shop, matchedProduct }) => {
      const cover = shop.shop_images?.[0]?.url ? `background-image:url('${shop.shop_images[0].url}')` : '';
      return `
      <div class="shop-card" data-id="${shop.id}">
        <div class="shop-cover" style="${cover}">
          ${!shop.shop_images?.[0]?.url ? `<div class="shop-cover-empty">${ICON_STORE_LG}</div>` : ''}
          <div class="shop-cover-info">
            <h3>${escapeHtml(shop.business_name)}</h3>
            ${shop.location ? `<span class="shop-loc">${ICON_PIN}${escapeHtml(shop.location)}</span>` : ''}
          </div>
        </div>
        <div class="shop-card-foot" style="flex-direction:column;align-items:flex-start;gap:6px;">
          <div style="display:flex;align-items:center;justify-content:space-between;width:100%;">
            <span style="font-size:0.82rem;color:var(--ink-soft);">${shop.products.length} product${shop.products.length===1?'':'s'}</span>
            <span class="view-shop">View shop ${ICON_CHEV}</span>
          </div>
          ${matchedProduct ? `<span class="match-note">${ICON_TAG_SM}Sells "${escapeHtml(matchedProduct.name)}"</span>` : ''}
        </div>
      </div>`;
    }).join('');
    wrap.querySelectorAll('.shop-card').forEach(card=>{
      card.addEventListener('click', ()=> openDetail(allShops.find(s => s.id === card.dataset.id)));
    });
  }

  async function loadShops(){
    $('#cardArea').innerHTML = `<div class="loading-row">Loading shops…</div>`;
    renderCategoryRow();
    allShops = await fetchShops();
    renderCards($('#shopSearch').value);
  }

  let searchDebounce;
  $('#shopSearch').addEventListener('input', function(){
    $('#searchWrap').classList.toggle('has-value', this.value.length > 0);
    clearTimeout(searchDebounce);
    searchDebounce = setTimeout(()=> renderCards(this.value), 150);
  });
  $('#clearSearch').addEventListener('click', ()=>{
    $('#shopSearch').value = '';
    $('#searchWrap').classList.remove('has-value');
    renderCards('');
    $('#shopSearch').focus();
  });

  /* ---------------- map tab ---------------- */
  let mapScriptLoading = null;
  let gMap = null;
  let mapMarkers = [];

  function loadGoogleMapsScript(){
    if(window.google?.maps) return Promise.resolve();
    if(mapScriptLoading) return mapScriptLoading;
    mapScriptLoading = new Promise((resolve, reject)=>{
      window.__dukaFindMapReady = () => resolve();
      const script = document.createElement('script');
      script.src = `https://maps.googleapis.com/maps/api/js?key=${GOOGLE_MAPS_API_KEY}&callback=__dukaFindMapReady`;
      script.async = true;
      script.onerror = () => reject(new Error('Failed to load Google Maps'));
      document.head.appendChild(script);
    });
    return mapScriptLoading;
  }

  async function initMapTab(){
    if(GOOGLE_MAPS_API_KEY.includes('YOUR-GOOGLE-MAPS-API-KEY')){
      $('#mapContainer').innerHTML = `
        <div class="empty-state" style="margin:20px;">
          <div class="es-icon">${ICON_STORE_LG}</div>
          <h3>Map not set up yet</h3>
          <p>A Google Maps API key needs to be added to this file before the map can load.</p>
        </div>`;
      return;
    }
    try{
      await loadGoogleMapsScript();
    }catch(err){
      console.error(err);
      $('#mapContainer').innerHTML = `<div class="empty-state" style="margin:20px;"><h3>Could not load the map</h3><p>Check your internet connection and try again.</p></div>`;
      return;
    }

    const pinned = allShops.filter(s => s.latitude != null && s.longitude != null);
    if(!gMap){
      $('#mapContainer').innerHTML = '';
      const center = pinned.length
        ? { lat: pinned[0].latitude, lng: pinned[0].longitude }
        : { lat: 0.3476, lng: 32.5825 }; // Kampala, as a sensible default
      gMap = new google.maps.Map($('#mapContainer'), { center, zoom: pinned.length ? 13 : 12 });
    }

    mapMarkers.forEach(m => m.setMap(null));
    mapMarkers = [];

    if(pinned.length === 0){
      const notice = document.createElement('div');
      notice.className = 'empty-state';
      notice.style.cssText = 'position:absolute;top:16px;left:16px;right:16px;z-index:1;max-width:360px;';
      notice.innerHTML = `<h3 style="font-size:0.95rem;">No pinned shops yet</h3><p style="font-size:0.85rem;">Shops will appear here once their owner sets a location.</p>`;
      $('#mapContainer').appendChild(notice);
      return;
    }

    const bounds = new google.maps.LatLngBounds();
    pinned.forEach(shop=>{
      const marker = new google.maps.Marker({
        position: { lat: shop.latitude, lng: shop.longitude },
        map: gMap,
        title: shop.business_name
      });
      const info = new google.maps.InfoWindow({
        content: `<div style="font-family:'Inter',sans-serif;padding:2px;">
          <strong>${escapeHtml(shop.business_name)}</strong><br>
          <span style="color:#5C6B5F;font-size:0.85rem;">${escapeHtml(shop.location || '')}</span><br>
          <button id="mapViewShop-${shop.id}" style="margin-top:8px;background:#2E6E4E;color:#fff;border:none;border-radius:999px;padding:6px 14px;font-size:0.8rem;font-weight:700;cursor:pointer;">View shop</button>
        </div>`
      });
      marker.addListener('click', ()=>{
        info.open({ anchor: marker, map: gMap });
        google.maps.event.addListenerOnce(info, 'domready', ()=>{
          $('#mapViewShop-' + shop.id)?.addEventListener('click', ()=> openDetail(shop));
        });
      });
      mapMarkers.push(marker);
      bounds.extend(marker.getPosition());
    });
    if(pinned.length > 1) gMap.fitBounds(bounds);
  }

  function renderProductCards(products, query = ''){
    const q = query.trim().toLowerCase();
    const filtered = q
      ? products.filter(p => p.name?.toLowerCase().includes(q) || p.description?.toLowerCase().includes(q))
      : products;
    if(products.length === 0) return `<p style="color:var(--ink-soft);font-size:0.9rem;">No products listed yet — check back soon.</p>`;
    if(filtered.length === 0) return `<p style="color:var(--ink-soft);font-size:0.9rem;">No products match "${escapeHtml(query.trim())}".</p>`;
    return filtered.map(p => `
      <div class="product-card">
        <div class="product-img-wrap ${p.image_url ? 'has-img' : ''}">
          ${p.image_url
            ? `<img src="${p.image_url}" data-lightbox="${p.image_url}" alt="${escapeHtml(p.name)}">`
            : ICON_STORE_LG}
        </div>
        <div class="product-card-body">
          <h4 title="${escapeHtml(p.name)}">${escapeHtml(p.name)}</h4>
          <div class="meta-row">
            <span class="tag">UGX ${fmt(p.price)}</span>
            ${p.negotiable ? '<span class="neg-note">Negotiable</span>' : ''}
          </div>
          <p class="product-desc">${escapeHtml(p.description || '')}</p>
          <button class="product-talk-btn" data-product="${escapeHtml(p.name)}">${ICON_CHAT_SM} Talk about this</button>
        </div>
      </div>`).join('');
  }

  function openDetail(shop){
    const cover = shop.shop_images?.[0]?.url ? `background-image:url('${shop.shop_images[0].url}')` : '';
    const gallery = (shop.shop_images || []).slice(1).map(img => `<img src="${img.url}">`).join('');

    $('#detailBody').innerHTML = `
      <div class="detail-cover" style="${cover}"></div>
      <div class="detail-content">
        <h1>${escapeHtml(shop.business_name)}</h1>
        ${shop.location ? `<span class="shop-loc" style="color:var(--ink-soft);">${ICON_PIN}${escapeHtml(shop.location)}</span>` : ''}
        <div><span class="verified-badge">${ICON_CHECK} TIN verified</span></div>
        ${gallery ? `<div class="gallery">${gallery}</div>` : ''}
        ${shop.delivery_policy ? `<div class="policy">${ICON_TRUCK}<div><b>Delivery policy</b>${escapeHtml(shop.delivery_policy)}</div></div>` : ''}
        <h3 style="font-size:1.08rem;margin-bottom:12px;">Products</h3>
        ${shop.products.length ? `
        <div class="search-wrap" id="productSearchWrap" style="max-width:100%;margin-bottom:16px;">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
          <input type="text" id="productSearch" placeholder="Search products in this shop">
          <button class="clear-btn" id="clearProductSearch" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button>
        </div>` : ''}
        <div class="products-grid" id="detailProductsGrid">${renderProductCards(shop.products)}</div>
      </div>`;

    bindProductTalkButtons(shop);
    bindLightboxImages();

    if(shop.products.length){
      const searchInput = $('#productSearch');
      searchInput.addEventListener('input', function(){
        $('#productSearchWrap').classList.toggle('has-value', this.value.length > 0);
        $('#detailProductsGrid').innerHTML = renderProductCards(shop.products, this.value);
        bindProductTalkButtons(shop);
        bindLightboxImages();
      });
      $('#clearProductSearch').addEventListener('click', ()=>{
        searchInput.value = '';
        $('#productSearchWrap').classList.remove('has-value');
        $('#detailProductsGrid').innerHTML = renderProductCards(shop.products);
        bindProductTalkButtons(shop);
        bindLightboxImages();
        searchInput.focus();
      });
    }
    openPushed('#view-detail');
  }

  function bindLightboxImages(){
    document.querySelectorAll('[data-lightbox]').forEach(img=>{
      img.addEventListener('click', ()=> openLightbox(img.dataset.lightbox));
    });
  }

  function bindProductTalkButtons(shop){
    document.querySelectorAll('.product-talk-btn').forEach(btn=>{
      btn.addEventListener('click', ()=> openChat(shop.id, shop.business_name, null, btn.dataset.product));
    });
  }

  /* ---------------- messages tab: conversation list ---------------- */
  async function renderConvList(){
    const wrap = $('#convList');
    if(!currentUser){
      wrap.innerHTML = `
        <div class="empty-state">
          <div class="es-icon">${ICON_CHAT_SM}</div>
          <h3>Sign in to see your messages</h3>
          <p>You'll need a Google account to chat with shop owners.</p>
          <button class="google-btn" id="convSignIn">${ICON_GOOGLE} Sign in with Google</button>
        </div>`;
      $('#convSignIn').addEventListener('click', signInWithGoogle);
      return;
    }
    const { data, error } = await sb
      .from('conversations')
      .select('id, shop_id, shops(business_name), messages(sender_role, body, created_at)')
      .eq('customer_id', currentUser.id)
      .order('created_at', { ascending: false });
    if(error){ console.error(error); wrap.innerHTML = `<div class="empty-state"><h3>Couldn't load messages</h3></div>`; return; }
    if(!data || data.length === 0){
      wrap.innerHTML = `
        <div class="empty-state">
          <div class="es-icon">${ICON_CHAT_SM}</div>
          <h3>No conversations yet</h3>
          <p>Chats you start with shop owners will show up here.</p>
        </div>`;
      return;
    }
    wrap.innerHTML = data.map(c => {
      const msgs = (c.messages || []).slice().sort((a,b)=> new Date(a.created_at) - new Date(b.created_at));
      const last = msgs[msgs.length - 1];
      const unread = last && last.sender_role === 'owner';
      const name = c.shops?.business_name || 'Shop';
      return `
        <div class="conv-row" data-cid="${c.id}" data-shop="${c.shop_id}" data-name="${escapeHtml(name)}">
          <div class="avatar">${name.charAt(0).toUpperCase()}</div>
          <div class="conv-main">
            <div class="conv-top">
              <h4>${escapeHtml(name)}</h4>
              ${last ? `<span class="conv-time">${new Date(last.created_at).toLocaleDateString([], {month:'short', day:'numeric'})}</span>` : ''}
            </div>
            <div class="conv-preview">
              <p>${last ? escapeHtml(last.body) : 'Say hello and ask about their products'}</p>
              ${unread ? `<span class="dot"></span>` : ''}
            </div>
          </div>
        </div>`;
    }).join('');
    wrap.querySelectorAll('.conv-row').forEach(row=>{
      row.addEventListener('click', ()=> openChat(row.dataset.shop, row.dataset.name, row.dataset.cid));
    });
  }

  /* ---------------- chat ---------------- */
  async function getOrCreateConversation(shopId){
    let { data } = await sb.from('conversations')
      .select('*').eq('shop_id', shopId).eq('customer_id', currentUser.id).maybeSingle();
    if(!data){
      const { data: created, error } = await sb.from('conversations')
        .insert({ shop_id: shopId, customer_id: currentUser.id }).select().single();
      if(error){ console.error(error); return null; }
      data = created;
    }
    return data;
  }

  async function openChat(shopId, shopName, knownConvoId, productName){
    if(!currentUser){ await signInWithGoogle(); return; }
    const convo = knownConvoId ? { id: knownConvoId } : await getOrCreateConversation(shopId);
    if(!convo) return;
    openConversationId = convo.id;

    $('#chatTitle').textContent = shopName;
    $('#chatAvatar').textContent = (shopName || '?').charAt(0).toUpperCase();
    $('#chatSubtitle').textContent = productName ? `Asking about "${productName}"` : 'In-app chat';
    $('#chatScroll').innerHTML = `<div class="loading-row">Loading chat…</div>`;
    openPushed('#view-chat');

    // Prefill the message so the shop owner sees the product name the moment it's sent —
    // the customer can still edit or add to it before hitting send.
    if(productName){
      $('#chatInput').value = `Hi! I'm interested in "${productName}" — `;
      $('#chatInput').dispatchEvent(new Event('input'));
    }

    await loadMessages(convo.id);
    subscribeToChat(convo.id);
    setTimeout(()=>{
      const input = $('#chatInput');
      input.focus();
      input.setSelectionRange(input.value.length, input.value.length);
    }, 300);
  }

  async function loadMessages(conversationId){
    const { data, error } = await sb.from('messages')
      .select('*').eq('conversation_id', conversationId).order('created_at');
    if(error){ console.error(error); return; }
    renderMessages(data);
  }

  function renderMessages(msgs){
    const body = $('#chatScroll');
    if(!msgs || msgs.length === 0){
      body.innerHTML = `<div class="empty-chat">Say hello 👋 — ask about prices, stock, or delivery.</div>`;
      return;
    }
    body.innerHTML = msgs.map(m => `
      <div class="msg ${m.sender_role}">
        ${m.image_url ? `<img class="chat-img" src="${m.image_url}" data-lightbox="${m.image_url}">` : ''}
        ${m.body ? `<span class="${m.image_url ? 'msg-caption' : ''}">${escapeHtml(m.body)}</span>` : ''}
        <time>${new Date(m.created_at).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'})}</time>
      </div>`).join('');
    body.scrollTop = body.scrollHeight;
    bindLightboxImages();
  }

  function subscribeToChat(conversationId){
    unsubscribeChannel();
    chatChannel = sb
      .channel(`conversation-${conversationId}`)
      .on('postgres_changes', {
        event: 'INSERT', schema: 'public', table: 'messages',
        filter: `conversation_id=eq.${conversationId}`
      }, () => loadMessages(conversationId))
      .subscribe();
  }
  // Only tears down the realtime channel — safe to call while switching between
  // conversations, since it does NOT touch openConversationId.
  function unsubscribeChannel(){
    if(chatChannel){ sb.removeChannel(chatChannel); chatChannel = null; }
  }
  // Fully leaving the chat screen: tear down the channel AND forget which
  // conversation was open.
  function leaveChatChannel(){
    unsubscribeChannel();
    openConversationId = null;
  }

  /* ---------------- chat image attach ---------------- */
  let pendingChatImage = null; // { file, previewUrl }

  $('#attachImageBtn').addEventListener('click', ()=> $('#chatImageInput').click());
  $('#chatImageInput').addEventListener('change', e=>{
    const file = e.target.files[0];
    if(!file) return;
    pendingChatImage = { file, previewUrl: URL.createObjectURL(file) };
    $('#imagePreviewThumb').src = pendingChatImage.previewUrl;
    $('#imagePreviewBar').hidden = false;
    e.target.value = '';
  });
  $('#removeImagePreview').addEventListener('click', ()=>{
    if(pendingChatImage) URL.revokeObjectURL(pendingChatImage.previewUrl);
    pendingChatImage = null;
    $('#imagePreviewBar').hidden = true;
  });

  async function uploadChatImage(file){
    const path = `${currentUser.id}/${Date.now()}-${file.name}`;
    const { error } = await sb.storage.from('chat-images').upload(path, file);
    if(error) throw error;
    return sb.storage.from('chat-images').getPublicUrl(path).data.publicUrl;
  }

  async function sendChat(){
    const input = $('#chatInput');
    const text = input.value.trim();
    if((!text && !pendingChatImage) || !openConversationId || !currentUser) return;

    const sendBtn = $('#chatSend');
    sendBtn.disabled = true;

    let imageUrl = null;
    if(pendingChatImage){
      try{
        imageUrl = await uploadChatImage(pendingChatImage.file);
      }catch(err){
        console.error(err);
        sendBtn.disabled = false;
        alert('Could not send the image — please try again.');
        return;
      }
    }

    input.value = ''; input.style.height = 'auto';
    if(pendingChatImage){ URL.revokeObjectURL(pendingChatImage.previewUrl); pendingChatImage = null; }
    $('#imagePreviewBar').hidden = true;

    const { error } = await sb.from('messages').insert({
      conversation_id: openConversationId, sender_id: currentUser.id, sender_role: 'customer',
      body: text || null, image_url: imageUrl
    });
    sendBtn.disabled = false;
    if(error) console.error(error);
    // realtime subscription will refresh the view; also refresh immediately for snappy feel
    loadMessages(openConversationId);
  }
  $('#chatSend').addEventListener('click', sendChat);
  $('#chatInput').addEventListener('keydown', e=>{ if(e.key==='Enter' && !e.shiftKey){ e.preventDefault(); sendChat(); } });
  $('#chatInput').addEventListener('input', function(){ this.style.height='auto'; this.style.height = Math.min(this.scrollHeight,110)+'px'; });

  /* ---------------- lightbox ---------------- */
  function openLightbox(url){
    $('#lightboxImg').src = url;
    $('#lightbox').classList.add('open');
  }
  function closeLightbox(){
    $('#lightbox').classList.remove('open');
    $('#lightboxImg').src = '';
  }
  $('#lightboxClose').addEventListener('click', closeLightbox);
  $('#lightbox').addEventListener('click', e=>{ if(e.target.id === 'lightbox') closeLightbox(); });

  /* ---------------- unread badge (rough heuristic: any conv whose last msg is from owner) ---------------- */
  async function updateBadges(){
    if(!currentUser){ [$('#topBadge'),$('#bottomBadge')].forEach(el=>el.hidden=true); return; }
    const { data } = await sb.from('conversations')
      .select('id, messages(sender_role, created_at)').eq('customer_id', currentUser.id);
    let unread = 0;
    (data||[]).forEach(c=>{
      const msgs = (c.messages||[]).slice().sort((a,b)=> new Date(a.created_at)-new Date(b.created_at));
      const last = msgs[msgs.length-1];
      if(last && last.sender_role === 'owner') unread++;
    });
    [$('#topBadge'),$('#bottomBadge')].forEach(el=>{
      if(unread>0){ el.hidden=false; el.textContent=unread; } else el.hidden=true;
    });
  }

  /* ---------------- boot ---------------- */
  // Registered first and immediately: supabase-js fires this once on load (with the
  // session it detects from the redirect URL, if any) and again on every future
  // sign-in/sign-out — so this alone keeps the UI correct no matter the timing.
  sb?.auth.onAuthStateChange(async (_event, session)=>{
    currentUser = session?.user ?? null;
    if(currentUser) await ensureCustomerProfile(currentUser);
    renderAuthArea();
    await updateBadges();
    if(currentRoot === 'messages') renderConvList();
  });

  async function init(){
    if(!sb){
      $('#cardArea').innerHTML = `
        <div class="empty-state" style="grid-column:1/-1;">
          <div class="es-icon">${ICON_STORE_LG}</div>
          <h3>Could not connect</h3>
          <p>The required library failed to load. Check your internet connection and reload the page.</p>
        </div>`;
      return;
    }
    await loadShops();
    // Fallback first paint in case onAuthStateChange's initial firing hasn't landed yet.
    const { data: { session } } = await sb.auth.getSession();
    if(session){
      currentUser = session.user;
      await ensureCustomerProfile(currentUser);
      renderAuthArea();
    }
    await updateBadges();
  }
  init();
</script>
</body>
</html>
